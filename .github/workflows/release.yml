name: Release
# A version tag (v1.0.0, ...) builds the image for amd64 and arm64, runs it on
# both and prints the reference the community store pins: tag and digest.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
# Never two releases at once, and never cancelled halfway: between the push
# and the smoke test sits an image nothing has checked yet.
concurrency:
  # Not "Release-...": ci.yml, called below, takes the name of this workflow
  # for its own group, and the two would wait on each other.
  group: peer-lab-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: ci
    runs-on: ubuntu-latest
    # The only job that may write a package.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag and app version agree
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for expr in "require('./app/package.json').version" "require('./app/package-lock.json').version" "require('./app/package-lock.json').packages[''].version"; do
            got=$(node -p "$expr")
            if [ "$got" != "$tag" ]; then
              echo "::error::$expr is $got, the tag says $tag"
              exit 1
            fi
          done
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/peer-lab:${{ steps.version.outputs.value }}
      # A signed statement that this digest was built here from this commit:
      #   gh attestation verify oci://ghcr.io/benunskilled/peer-lab:X.Y.Z --owner benunskilled
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/peer-lab
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # Built is not the same as runs: start each architecture, open the
      # database and wait for the peers service to answer. Nothing installs
      # the image on its own; a red run is one nobody copies a digest from.
      - name: Smoke-test both architectures
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/peer-lab@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --read-only --tmpfs /tmp \
              -e DATA_DIR=/tmp/data "$IMAGE" node -e "const db=require('./src/lib/db'); db.open(); if(db.instance.pragma('integrity_check',{simple:true})!=='ok')process.exit(1); db.instance.close()"
            name="peerlab-peers-$arch"
            docker run -d --name "$name" --platform "linux/$arch" --read-only \
              -e PEERS_DEMO=1 "$IMAGE" /peers
            ready=0
            for attempt in $(seq 1 30); do
              if docker exec "$name" /peers healthcheck; then ready=1; break; fi
              sleep 1
            done
            docker logs "$name"
            docker rm -f "$name"
            test "$ready" = 1
          done
      - name: Print pinned reference for the store
        run: |
          echo "Pin this in every image: line of the store entry:"
          echo "ghcr.io/${{ github.repository_owner }}/peer-lab:${{ steps.version.outputs.value }}@${{ steps.image.outputs.digest }}"
